# Override GPU Intel / AMD : passthrough via /dev/dri + encodage VA-API.
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.gpu-dri.yml up -d --build
#
# Prerequis hote : pilotes Mesa a jour.
#
# Rien d'autre a configurer : l'image de base (init-video) ajoute elle-meme
# l'utilisateur aux groupes proprietaires de /dev/dri, et detecte le noeud de
# rendu (AUTO_GPU) pour X (DRI3) comme pour l'encodage. N'ajouter DRINODE /
# DRI_NODE (bloc "environment") que pour forcer un GPU precis sur un hote
# multi-GPU : les definir desactive la detection automatique.

services:
  dofus:
    devices:
      - /dev/dri:/dev/dri
